<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarunnUndo - Kerala Proximity Pharmacy Finder</title>
  <link rel="icon" type="image/png" href="logo.png">
  <meta name="description" content="Verify medicine stock at nearby pharmacies instantly. Built for Kerala, India.">
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS Dependency -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
        
  <!-- Custom CSS Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- App Container -->
  <div class="app-container">
    
    <!-- Floating Search & Info Panel -->
    <div class="floating-panel">
      <!-- Header -->
      <header class="panel-header">
        <div class="logo-area">
          <img src="logo.png" class="app-logo" alt="MarunnUndo Logo">
          <div class="title-wrap">
            <h1 data-i18n="app-title">MarunnUndo</h1>
            <span class="sub-title" data-i18n="app-subtitle">മരുന്നുണ്ടോ?</span>
          </div>
          
          <div class="header-actions-group">
            <button id="btn-theme" class="header-action-btn" title="Toggle Theme" aria-label="Toggle Theme">
              <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
              </svg>
              <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
              </svg>
            </button>
            <button id="btn-lang" class="header-action-btn" title="Change Language" aria-label="Change Language">
              <span class="lang-label">മലയാളം</span>
            </button>
          </div>
        </div>
        <p class="tagline" data-i18n="tagline">Verify medicine stock at nearby pharmacies instantly.</p>
      </header>

      <!-- Search Box Section -->
      <div class="search-section">
        <!-- Place Search Input -->
        <div class="input-container" style="margin-bottom: 12px;">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          <input type="text" id="place-search" placeholder="Search place/city (e.g., Aluva, Trivandrum)..." autocomplete="off">
        </div>
        <!-- Medicine Search / Filter Input -->
        <div class="input-container">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 21L16.65 16.65M19 11C19 15.4183 15.4183 19 11 19C6.58172 19 3 15.4183 3 11C3 6.58172 6.58172 3 11 3C15.4183 3 19 6.58172 19 11Z" 
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <input type="text" id="medicine-search" placeholder="Type medicine name (e.g., Insulin)..." autocomplete="off">
        </div>
      </div>

      <!-- Live Location & Scan Info -->
      <div class="status-section">
        <div class="status-indicator">
          <span class="status-dot pulse" id="location-dot"></span>
          <span id="status-text" data-i18n="status-detecting">Detecting geolocation...</span>
        </div>
        <div class="coord-info" id="coord-display">--.----, --.----</div>
      </div>

      <!-- Action buttons -->
      <div class="actions-section">
        <button id="btn-scan" class="action-btn">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
            <circle cx="12" cy="12" r="3" fill="currentColor"/>
            <line x1="12" y1="1" x2="12" y2="4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="12" y1="20" x2="12" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="1" y1="12" x2="4" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="20" y1="12" x2="23" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span data-i18n="btn-scan">Use Current Location</span>
        </button>
      </div>

      <!-- Stores List Container -->
      <div class="results-container">
        <div class="results-header">
          <h3 data-i18n="results-title">Nearby Pharmacies</h3>
          <span class="badge" id="results-count">0 found</span>
        </div>
        


        <div class="list-placeholder" id="list-placeholder" data-i18n="list-placeholder">
          Please allow location access to discover shops.
        </div>
        <ul class="pharmacies-list" id="pharmacies-list">
          <!-- Populated dynamically via JS -->
        </ul>
      </div>

      <!-- Footer / Info -->
      <footer class="panel-footer">
        <span data-i18n="footer-text">MarunnUndo Made for Kerala.</span>
      </footer>
    </div>

    <!-- Leaflet Map Div -->
    <div id="map"></div>

  </div>

  <!-- Pharmacy Detail Panel (Slides in from the right / bottom) -->
  <div id="detail-panel" class="floating-detail-panel hidden">
    <div class="detail-header-image">
      <button id="btn-close-detail" class="detail-close-btn" aria-label="Close details">&times;</button>
      <div class="header-image-placeholder">
        <svg class="med-cross-banner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 5v14M5 12h14" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="banner-badge">PHARMACY</span>
      </div>
    </div>
    <div class="detail-content">

      <!-- Store name + category + rating + enrich status -->
      <div class="detail-main-info">
        <h2 id="detail-store-name">--</h2>
        <p id="detail-category" class="detail-subtext" data-i18n="detail-category-ph">Pharmacy / Medical Store</p>
      </div>

      <!-- Action circle buttons -->
      <div class="detail-actions-row">
        <button id="detail-btn-whatsapp" class="detail-action-circle">
          <div class="circle-icon wa">
            <svg class="wa-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.003 5.324 5.328 0 11.859 0c3.161.001 6.136 1.233 8.375 3.474 2.238 2.24 3.467 5.218 3.465 8.385-.005 6.537-5.33 11.861-11.86 11.861-2.008-.002-3.98-.513-5.732-1.488L0 24zm6.549-2.834c1.659.985 3.298 1.487 5.247 1.489 5.485 0 9.948-4.462 9.952-9.948.002-2.658-1.03-5.158-2.905-7.034C17.025 3.797 14.53 2.766 11.862 2.765c-5.487 0-9.95 4.463-9.954 9.95-.001 1.849.48 3.655 1.393 5.243l-.95 3.468 3.706-.96zm12.593-7.558c-.347-.174-2.057-1.011-2.375-1.127-.318-.116-.549-.174-.78.174-.231.347-.894 1.127-1.096 1.358-.202.231-.404.26-.75.087-.347-.174-1.464-.539-2.787-1.72-1.03-1.03-1.724-2.148-1.926-2.494-.203-.347-.022-.534.151-.708.156-.156.347-.405.52-.607.173-.203.231-.347.347-.578.115-.231.057-.434-.029-.607-.087-.173-.78-1.879-1.069-2.572-.28-.674-.564-.582-.78-.593-.202-.011-.434-.012-.665-.012-.231 0-.607.087-.924.434-.318.347-1.213 1.185-1.213 2.89 0 1.705 1.242 3.352 1.416 3.583.173.231 2.445 3.734 5.922 5.234.827.357 1.472.569 1.975.729.831.264 1.587.227 2.185.138.666-.1 2.057-.838 2.346-1.647.289-.809.289-1.502.202-1.647-.087-.145-.318-.232-.665-.405z"/>
            </svg>
          </div>
          <span class="action-label" data-i18n="detail-whatsapp">WhatsApp</span>
        </button>
        <button id="detail-btn-directions" class="detail-action-circle">
          <div class="circle-icon directions">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="3 11 22 2 13 21 11 13 3 11"/>
            </svg>
          </div>
          <span class="action-label" data-i18n="detail-directions">Directions</span>
        </button>

        <button id="detail-btn-call" class="detail-action-circle">
          <div class="circle-icon call">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
          </div>
          <span class="action-label" data-i18n="detail-call">Call</span>
        </button>
      </div>

      <!-- Info rows: address, phone, hours -->
      <div class="detail-info-section">
        <div class="info-item">
          <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          <div class="info-text">
            <span class="info-label" data-i18n="detail-address-label">Address</span>
            <span id="detail-address">--</span>
          </div>
        </div>
        <div class="info-item highlighted-phone">
          <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
          <div class="info-text">
            <span class="info-label">Phone</span>
            <span id="detail-phone" class="phone-link">--</span>
          </div>
        </div>
        <div class="info-item">
          <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          <div class="info-text">
            <span class="info-label" data-i18n="detail-hours-label">Hours</span>
            <span id="detail-hours">--</span>
          </div>
        </div>
      </div>

      <!-- Google Business Profile Button -->
      <button id="detail-btn-google-biz" class="detail-google-biz-btn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <path d="M21 21l-4.35-4.35"/>
        </svg>
        <span>Google Business Profile</span>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto;opacity:0.6">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
      </button>

    </div>
  </div>

  <!-- Leaflet JS Dependency -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
          
  <!-- Custom App JS -->
  <script src="app.js"></script>
</body>
</html>
